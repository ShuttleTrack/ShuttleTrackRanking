name: dutchlankanshuttlemasters FRONTEND Build (v3.0 migration)

# This is now the primary/only frontend publish workflow (the old v2.0 one was deleted once
# the Next.js backend migration - see MIGRATION_PLAN.md - was fully cut over, verified in
# production, and merged to main). Builds/pushes ghcr.io/catchsudheera/brs-frontend:v3.0.
#
# This workflow only builds and pushes the image to GHCR - it does not deploy/restart anything.
# Actually running the resulting image (Portainer, docker run, a temporary compose stack,
# whatever) is a separate, manual step outside this repo.

on: workflow_dispatch

jobs:
  push-frontend-image:
    runs-on: ubuntu-latest
    environment: production-dutchlankanshuttlemasters
    defaults:
      run:
        working-directory: './frontend'
    steps:
      - name: 'Checkout main branch'
        uses: actions/checkout@main
        with:
          ref: main

      - name: 'Login to ghcr'
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GHCR_PUSH_TOKEN}}

      - name: 'Build and push'
        run: |
          echo "NEXT_PUBLIC_AUTH_ENABLED=${{ secrets.NEXT_PUBLIC_AUTH_ENABLED }}" >> .env.production
          echo "NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}" >> .env.production
          echo "ALLOWED_ADMIN_EMAILS=${{ secrets.ALLOWED_ADMIN_EMAILS }}" >> .env.production
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env.production
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env.production
          echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" >> .env.production
          echo "NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}" >> .env.production
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env.production
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env.production
          echo "TELEGRAM_CHAT_ID_WEDNESDAY=${{ secrets.TELEGRAM_CHAT_ID_WEDNESDAY }}" >> .env.production
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> .env.production
          echo "NEXT_PUBLIC_BUILD_IDENTIFIER=v3.0-migration-$(TZ=Europe/Amsterdam date '+%Y-%m-%d %H:%M:%S')" >> .env.production
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          docker build . --tag ghcr.io/catchsudheera/brs-frontend:v3.0
          docker push ghcr.io/catchsudheera/brs-frontend:v3.0
