spring:
  datasource:
    url: jdbc:mysql://localhost:3306/brs
    username: brs_user
    password: local_dev_password
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

host:
  frontend: http://localhost:3000

api:
  key: sample-api-key
  admin:
    emails: test@test.com, test2@test.com
  tg:
    groups:
      MONDAY:
        matchDay: WEDNESDAY
        botKey: sample-telegram-key-2
        groupId: sample-group-id-2
      WEDNESDAY:
        matchDay: FRIDAY
        botKey: sample-telegram-key-3
        groupId: sample-group-id-3

server:
  forward-headers-strategy: NATIVE

google:
  client:
    id: test-client-id